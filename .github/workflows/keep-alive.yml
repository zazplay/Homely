# Free-tier helpers:
#  - Render puts a free web service to sleep after 15 min without traffic (~1 min cold start);
#  - Supabase pauses a free project after 7 days without database queries.
# Pinging the API every 10 minutes keeps both awake.
# Repository → Settings → Secrets and variables → Actions → Variables: API_URL = https://<service>.onrender.com
name: keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - name: Health check (wakes the Render service)
        run: curl --fail --silent --show-error --max-time 90 "${{ vars.API_URL }}/up" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
      - name: Database query (keeps the Supabase project active)
        run: curl --fail --silent --show-error --max-time 90 "${{ vars.API_URL }}/api/catalog/stats" -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
